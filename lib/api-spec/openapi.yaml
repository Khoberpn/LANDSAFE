components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sensorToken:
      type: apiKey
      in: header
      name: x-sensor-token
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean

    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [public, operator, admin]
        isActive:
          type: boolean
        createdAt:
          type: string
        lastLogin:
          type: ["string", "null"]

    UserInput:
      type: object
      required: [email, name, role, password]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [public, operator, admin]
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [public, operator, admin]
        isActive:
          type: boolean
        password:
          type: string

    DashboardStats:
      type: object
      required:
        - totalSensors
        - onlineSensors
        - offlineSensors
        - highRiskLocations
        - activeWarnings
        - normalLocations
        - avgRainfall
        - avgSoilMoisture
        - systemHealth
        - dbStatus
        - aiEngineStatus
        - networkStatus
      properties:
        totalSensors:
          type: integer
        onlineSensors:
          type: integer
        offlineSensors:
          type: integer
        highRiskLocations:
          type: integer
        activeWarnings:
          type: integer
        normalLocations:
          type: integer
        avgRainfall:
          type: number
        avgSoilMoisture:
          type: number
        systemHealth:
          type: string
          enum: [healthy, degraded, critical]
        dbStatus:
          type: string
          enum: [connected, disconnected]
        aiEngineStatus:
          type: string
          enum: [active, inactive, error]
        networkStatus:
          type: string
          enum: [stable, unstable, down]

    ActivityItem:
      type: object
      required: [id, type, message, priority, timestamp]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [alert, sensor_offline, battery_low, rainfall_warning, ground_movement, earthquake, notification_sent, threshold_exceeded]
        message:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low, info]
        locationName:
          type: ["string", "null"]
        timestamp:
          type: string

    RiskSummary:
      type: object
      required: [danger, alert, watch, normal]
      properties:
        danger:
          type: integer
        alert:
          type: integer
        watch:
          type: integer
        normal:
          type: integer
        trend:
          type: string
          enum: [improving, stable, worsening]

    Location:
      type: object
      required: [id, name, district, province, latitude, longitude, riskLevel, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        district:
          type: string
        province:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        elevation:
          type: ["number", "null"]
        riskLevel:
          type: string
          enum: [normal, watch, alert, danger]
        status:
          type: string
          enum: [active, inactive, maintenance]
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    LocationInput:
      type: object
      required: [name, district, province, latitude, longitude]
      properties:
        name:
          type: string
        district:
          type: string
        province:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        elevation:
          type: number
        description:
          type: string

    LocationUpdate:
      type: object
      properties:
        name:
          type: string
        district:
          type: string
        province:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        elevation:
          type: number
        riskLevel:
          type: string
          enum: [normal, watch, alert, danger]
        status:
          type: string
          enum: [active, inactive, maintenance]
        description:
          type: string

    Sensor:
      type: object
      required: [id, locationId, sensorCode, sensorType, status, batteryLevel, signalStrength, createdAt]
      properties:
        id:
          type: integer
        locationId:
          type: integer
        locationName:
          type: ["string", "null"]
        sensorCode:
          type: string
        sensorType:
          type: string
          enum: [rainfall, soil_moisture, tilt, acceleration, temperature, humidity, battery_voltage, solar_charging, all_in_one]
        status:
          type: string
          enum: [online, offline, maintenance, calibration]
        batteryLevel:
          type: number
        signalStrength:
          type: number
        firmwareVersion:
          type: ["string", "null"]
        lastSeen:
          type: ["string", "null"]
        createdAt:
          type: string

    SensorInput:
      type: object
      required: [locationId, sensorCode, sensorType]
      properties:
        locationId:
          type: integer
        sensorCode:
          type: string
        sensorType:
          type: string
          enum: [rainfall, soil_moisture, tilt, acceleration, temperature, humidity, battery_voltage, solar_charging, all_in_one]
        firmwareVersion:
          type: string

    SensorUpdate:
      type: object
      properties:
        sensorCode:
          type: string
        sensorType:
          type: string
          enum: [rainfall, soil_moisture, tilt, acceleration, temperature, humidity, battery_voltage, solar_charging, all_in_one]
        status:
          type: string
          enum: [online, offline, maintenance, calibration]
        firmwareVersion:
          type: string

    Measurement:
      type: object
      required: [id, sensorId, timestamp]
      properties:
        id:
          type: integer
        sensorId:
          type: integer
        locationId:
          type: ["integer", "null"]
        timestamp:
          type: string
        rainfall:
          type: ["number", "null"]
        soilMoisture:
          type: ["number", "null"]
        tiltAngle:
          type: ["number", "null"]
        acceleration:
          type: ["number", "null"]
        temperature:
          type: ["number", "null"]
        humidity:
          type: ["number", "null"]
        batteryVoltage:
          type: ["number", "null"]
        solarCharging:
          type: ["number", "null"]
        signalQuality:
          type: ["number", "null"]

    MeasurementInput:
      type: object
      required: [sensorId, timestamp]
      properties:
        sensorId:
          type: integer
        timestamp:
          type: string
        rainfall:
          type: number
        soilMoisture:
          type: number
        tiltAngle:
          type: number
        acceleration:
          type: number
        temperature:
          type: number
        humidity:
          type: number
        batteryVoltage:
          type: number
        solarCharging:
          type: number
        signalQuality:
          type: number

    Alert:
      type: object
      required: [id, locationId, alertType, priority, status, message, createdAt]
      properties:
        id:
          type: integer
        locationId:
          type: integer
        locationName:
          type: ["string", "null"]
        alertType:
          type: string
          enum: [threshold_exceeded, rainfall_warning, sensor_offline, battery_low, ground_movement, earthquake, emergency_notification]
        priority:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [active, acknowledged, resolved]
        message:
          type: string
        operatorId:
          type: ["integer", "null"]
        operatorName:
          type: ["string", "null"]
        acknowledgedAt:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    AlertUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [acknowledged, resolved]
        operatorNote:
          type: string

    Device:
      type: object
      required: [id, deviceId, locationId, status, batteryLevel, signalStrength, lastCommunication, createdAt]
      properties:
        id:
          type: integer
        deviceId:
          type: string
        locationId:
          type: integer
        locationName:
          type: ["string", "null"]
        firmwareVersion:
          type: string
        status:
          type: string
          enum: [online, offline, maintenance, calibration]
        batteryLevel:
          type: number
        signalStrength:
          type: number
        lastCommunication:
          type: string
        installationDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    DeviceInput:
      type: object
      required: [deviceId, locationId]
      properties:
        deviceId:
          type: string
        locationId:
          type: integer
        firmwareVersion:
          type: string
        installationDate:
          type: string
        notes:
          type: string

    DeviceUpdate:
      type: object
      properties:
        firmwareVersion:
          type: string
        status:
          type: string
          enum: [online, offline, maintenance, calibration]
        notes:
          type: string

    RiskAnalysis:
      type: object
      required: [locationId, locationName, riskLevel, probability, confidence, analyzedAt]
      properties:
        locationId:
          type: integer
        locationName:
          type: string
        riskLevel:
          type: string
          enum: [normal, watch, alert, danger]
        probability:
          type: number
