openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LANDSAFE - Land Stability and Safety Framework API
security:
  - bearerAuth: []
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard and KPI data
  - name: locations
    description: Monitoring locations
  - name: sensors
    description: Sensors
  - name: measurements
    description: Sensor measurements
  - name: alerts
    description: Alert events
  - name: devices
    description: Hardware devices
  - name: ai
    description: AI Risk Analysis
  - name: reports
    description: Report generation
  - name: users
    description: User management
  - name: audit
    description: Audit logs
  - name: risk
    description: Risk & vulnerability assessment
  - name: scenarios
    description: Hypothetical scenario & impact analysis
  - name: datahub
    description: Data integration hub
  - name: mitigation
    description: Mitigation planning & evacuation resources (internal)
  - name: public
    description: Public mitigation portal (no authentication)
  - name: evacuation
    description: Evacuation Route Intelligence, field verification, and scenario optimization

paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      security: []
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change current user's password and revoke existing tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
        "400":
          description: Invalid new password
        "401":
          description: Current password incorrect or unauthorized

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get KPI statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/risk-summary:
    get:
      operationId: getDashboardRiskSummary
      tags: [dashboard]
      summary: Get risk level breakdown by location
      responses:
        "200":
          description: Risk summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSummary"

  /locations:
    get:
      operationId: getLocations
      tags: [locations]
      summary: List all monitoring locations
      responses:
        "200":
          description: Locations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get location by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sensors:
    get:
      operationId: getSensors
      tags: [sensors]
      summary: List sensors
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sensors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sensor"
    post:
      operationId: createSensor
      tags: [sensors]
      summary: Create sensor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"

  /sensors/{id}:
    get:
      operationId: getSensor
      tags: [sensors]
      summary: Get sensor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sensor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
    patch:
      operationId: updateSensor
      tags: [sensors]
      summary: Update sensor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"
    delete:
      operationId: deleteSensor
      tags: [sensors]
      summary: Delete sensor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sensors/{id}/readings:
    get:
      operationId: getSensorReadings
      tags: [sensors]
      summary: Get time-series readings for a sensor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: resolution
          in: query
          schema:
            type: string
            enum: [raw, hourly, daily]
            default: raw
      responses:
        "200":
          description: Sensor readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Measurement"

  /measurements:
    get:
      operationId: getMeasurements
      tags: [measurements]
      summary: Query measurements with filters
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
        - name: sensorId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Measurement"
    post:
      security:
        - bearerAuth: []
        - sensorToken: []
      operationId: createMeasurement
      tags: [measurements]
      summary: Ingest a sensor measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
        - name: priority
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, acknowledged, resolved]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    get:
      operationId: getAlert
      tags: [alerts]
      summary: Get alert by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
    patch:
      operationId: updateAlert
      tags: [alerts]
      summary: Update alert status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertUpdate"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /devices:
    get:
      operationId: getDevices
      tags: [devices]
      summary: List devices
      responses:
        "200":
          description: Devices list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createDevice
      tags: [devices]
      summary: Create device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"

  /devices/{id}:
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get device by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
    patch:
      operationId: updateDevice
      tags: [devices]
      summary: Update device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Delete device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ai/risk-analysis:
    get:
      operationId: getRiskAnalysisList
      tags: [ai]
      summary: Get risk analysis for all locations
      responses:
        "200":
          description: Risk analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskAnalysis"

  /ai/risk-analysis/{locationId}:
    get:
      operationId: getRiskAnalysis
      tags: [ai]
      summary: Get AI risk analysis for a location
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAnalysis"

  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: List generated reports
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List users (admin only)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /audit:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: Get audit logs (admin only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /risk/assessments:
    get:
      operationId: getRiskAssessments
      tags: [risk]
      summary: List regional risk assessments (BPBD only)
      parameters:
        - name: hazardType
          in: query
          schema:
            type: string
        - name: province
          in: query
          schema:
            type: string
        - name: riskClass
          in: query
          schema:
            type: string
        - name: verified
          in: query
          schema:
            type: boolean
        - name: minScore
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Risk assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskAssessment"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /risk/summary:
    get:
      operationId: getRiskSummary
      tags: [risk]
      summary: Aggregate risk indicators across all assessed regions
      responses:
        "200":
          description: Risk summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalRiskSummary"

  /risk/rankings:
    get:
      operationId: getRiskRankings
      tags: [risk]
      summary: High-risk area ranking
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Ranked areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskRanking"

  /risk/assessments/{id}/verify:
    patch:
      operationId: verifyRiskAssessment
      tags: [risk]
      summary: Mark an assessment as verified (audited)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAssessmentInput"
      responses:
        "200":
          description: Updated assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /scenarios:
    get:
      operationId: getScenarios
      tags: [scenarios]
      summary: List saved scenarios (simulations only)
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Run and store a hypothetical impact simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioInput"
      responses:
        "201":
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: Invalid input

  /scenarios/compare:
    post:
      operationId: compareScenarios
      tags: [scenarios]
      summary: Compare two to four saved scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareScenariosInput"
      responses:
        "200":
          description: Scenario comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioComparison"
        "400":
          description: Invalid input

  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Scenario detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a saved scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /scenarios/{id}/report:
    get:
      operationId: getScenarioReport
      tags: [scenarios]
      summary: Download a plain-text scenario assessment report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plain text report
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Not found

  /data-hub/sources:
    get:
      operationId: getDataSources
      tags: [datahub]
      summary: List registered data sources with sync status
      responses:
        "200":
          description: Data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"

  /data-hub/sources/{id}:
    patch:
      operationId: updateDataSource
      tags: [datahub]
      summary: Update a data source registry entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDataSourceInput"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSource"
        "400":
          description: Invalid input
        "404":
          description: Not found

  /data-hub/sources/{id}/sync:
    post:
      operationId: syncDataSource
      tags: [datahub]
      summary: Trigger a synchronisation attempt for one source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync outcome (synced, simulated or unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "404":
          description: Not found

  /data-hub/logs:
    get:
      operationId: getIntegrationLogs
      tags: [datahub]
      summary: Integration and error log
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: level
          in: query
          schema:
            type: string
        - name: sourceId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationLogEntry"

  /data-hub/quality:
    get:
      operationId: getDataQuality
      tags: [datahub]
      summary: Compute validation, completeness and duplicate checks
      responses:
        "200":
          description: Data quality report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityReport"

  /data-hub/validation/run:
    post:
      operationId: runDataValidation
      tags: [datahub]
      summary: Run the validation suite and record the run in the log
      responses:
        "200":
          description: Data quality report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityReport"

  /mitigation/recommendations:
    get:
      operationId: getMitigationRecommendations
      tags: [mitigation]
      summary: Regional mitigation priorities derived from risk assessments
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MitigationRecommendation"

  /mitigation/plans:
    get:
      operationId: getMitigationPlans
      tags: [mitigation]
      summary: List all mitigation plans (internal)
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MitigationPlan"
    post:
      operationId: createMitigationPlan
      tags: [mitigation]
      summary: Create a draft mitigation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMitigationPlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MitigationPlanDetail"
        "400":
          description: Invalid input

  /mitigation/plans/{id}:
    get:
      operationId: getMitigationPlan
      tags: [mitigation]
      summary: Mitigation plan detail with actions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
